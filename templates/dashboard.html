{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">
        Dashboard
    </h1>
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    {{template "flashes" .Flashes}}
    <div id="emptyMessage" style="display:none;">
        <div class="alert alert-info">
            No campaigns created yet. <a href="/campaigns">Let's create one!</a>
        </div>
    </div>
    <div id="dashboard" style="display:none;">

        <!-- Channel filter -->
        <div class="gf-channel-filter" id="channelFilter">
            <button type="button" class="btn btn-default active" data-ch="all">All channels</button>
            <button type="button" class="btn btn-default" data-ch="email"><i class="fa fa-envelope"></i> Email</button>
            <button type="button" class="btn btn-default" data-ch="LINE"><i class="fa fa-comment"></i> LINE</button>
            <button type="button" class="btn btn-default" data-ch="SMS"><i class="fa fa-mobile"></i> SMS</button>
        </div>

        <!-- Campaign timeline -->
        <div class="panel gf-card">
            <div class="panel-heading">Campaign timeline<span class="gf-sub">events across all campaigns</span></div>
            <div class="panel-body">
                <div id="overview_chart" style="height:220px;"></div>
            </div>
        </div>

        <!-- Engagement funnel -->
        <div class="gf-stat-row">
            <div class="gf-stat">
                <div class="gf-stat-head"><span class="gf-dot" style="background:var(--gf-sent)"></span>Sent</div>
                <div id="sent_chart" class="gf-donut" style="height:170px;"></div>
            </div>
            <div class="gf-stat">
                <div class="gf-stat-head"><span class="gf-dot" style="background:var(--gf-opened)"></span>Opened</div>
                <div id="opened_chart" class="gf-donut" style="height:170px;"></div>
            </div>
            <div class="gf-stat">
                <div class="gf-stat-head"><span class="gf-dot" style="background:var(--gf-clicked)"></span>Clicked</div>
                <div id="clicked_chart" class="gf-donut" style="height:170px;"></div>
            </div>
            <div class="gf-stat">
                <div class="gf-stat-head"><span class="gf-dot" style="background:var(--gf-red)"></span>Submitted data</div>
                <div id="submitted_data_chart" class="gf-donut" style="height:170px;"></div>
            </div>
            <div class="gf-stat">
                <div class="gf-stat-head"><span class="gf-dot" style="background:var(--gf-green)"></span>Reported</div>
                <div id="email_reported_chart" class="gf-donut" style="height:170px;"></div>
            </div>
            <div class="gf-stat">
                <div class="gf-stat-head"><span class="gf-dot" style="background:#5e5ce6"></span>QR scans</div>
                <div id="qr_scanned_chart" class="gf-donut" style="height:170px;"></div>
            </div>
        </div>

        <!-- Recent campaigns -->
        <div class="panel gf-card">
            <div class="panel-heading">
                Recent campaigns
                <a href="/campaigns" class="btn btn-default btn-sm pull-right">View all</a>
            </div>
            <table id="campaignTable" class="table" style="margin-bottom:0;">
                <thead>
                    <tr>
                        <th class="col-md-2 col-sm-2">Name</th>
                        <th class="col-md-2 col-sm-2">Created Date</th>
                        <th class="col-md-1 col-sm-1" title="Sent"><i class="fa fa-envelope-o"></i></th>
                        <th class="col-md-1 col-sm-1" title="Opened"><i class="fa fa-envelope-open-o"></i></th>
                        <th class="col-md-1 col-sm-1" title="Clicked"><i class="fa fa-mouse-pointer"></i></th>
                        <th class="col-md-1 col-sm-1" title="Submitted data"><i class="fa fa-exclamation-circle"></i></th>
                        <th class="col-md-1 col-sm-1" title="Reported"><i class="fa fa-bullhorn"></i></th>
                        <th class="col-md-1 col-sm-1">Status</th>
                        <th class="col-md-2 col-sm-2 no-sort"></th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/dashboard.min.js"></script>
{{end}}
