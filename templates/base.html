{{ define "base" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GishFlow - Phishing Simulation Platform">
    <meta name="author" content="Jordan Wright (http://github.com/jordan-wright)">
    <link rel="shortcut icon" href="/images/favicon.ico">

    <!-- GishFlow theme init (set before paint to avoid flash) + toggle -->
    <script>
    (function(){ try{ var t=localStorage.getItem('gf-theme'); if(t){ document.documentElement.setAttribute('data-theme',t); } }catch(e){} })();
    (function(){ try{ if(localStorage.getItem('gf-nav')==='pinned'){ document.documentElement.setAttribute('data-nav','pinned'); } }catch(e){} })();
    function gfTogglePin(){
        var el=document.documentElement, pinned=el.getAttribute('data-nav')==='pinned';
        if(pinned){ el.removeAttribute('data-nav'); try{ localStorage.removeItem('gf-nav'); }catch(e){} }
        else{ el.setAttribute('data-nav','pinned'); try{ localStorage.setItem('gf-nav','pinned'); }catch(e){} }
    }
    function gfToggleTheme(){
        var el=document.documentElement, cur=el.getAttribute('data-theme');
        if(!cur){ cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
        var next=(cur==='dark')?'light':'dark';
        el.setAttribute('data-theme',next);
        try{ localStorage.setItem('gf-theme',next); }catch(e){}
        gfSetThemeIcon(next);
    }
    function gfSetThemeIcon(t){ var i=document.getElementById('gf-theme-ico'); if(i){ i.className='fa fa-'+((t==='dark')?'sun-o':'moon-o'); } }
    document.addEventListener('DOMContentLoaded',function(){
        var el=document.documentElement, cur=el.getAttribute('data-theme');
        if(!cur){ cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
        gfSetThemeIcon(cur);
    });
    </script>

    <title>{{ .Title }} - GishFlow</title>

    <link href="/css/dist/gophish.css" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Roboto:700,500' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,300,600,700' rel='stylesheet' type='text/css'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" type="text/css">
    <!-- GishFlow theme: minimal Apple-style restyle, layered over gophish.css -->
    <link href="/css/gishflow-theme.css" rel="stylesheet" type="text/css">
    <script>
        {{if .User}}
    var user = {
        api_key : {{ .User.ApiKey }},
        username : {{ .User.Username }}
    }
    {{end}}
    {{if .Token}}
        var csrf_token = {{.Token}}
    {{end}}
    </script>
</head>

<body>
    <!-- Left hover-reveal navigation drawer (relocated from the top bar). Hover
         the thin hot-zone on the left edge to slide it out, or pin it open with
         the tack button. -->
    <div class="gf-hotzone" aria-hidden="true"></div>
    <aside class="gf-sidebar" role="navigation">
        <div class="gf-sidebar-head">
            <a class="gf-sidebar-brand" href="/">GishFlow</a>
            {{if .User}}
            <button type="button" class="gf-pin" onclick="gfTogglePin()" title="ปักหมุดเมนู / Pin menu" aria-label="Pin menu">
                <i class="fa fa-thumb-tack"></i>
            </button>
            {{end}}
        </div>
        {{if .User}}
        {{template "nav" .}}
        <ul class="nav nav-sidebar gf-topnav gf-subnav">
            <li><a href="/qr"><i class="fa fa-qrcode"></i> QR Generator</a></li>
            <li><a href="/settings"><i class="fa fa-cog"></i> Settings</a></li>
            {{if .ModifySystem}}
            <li><a href="/users"><i class="fa fa-users"></i> Users</a></li>
            <li><a href="/webhooks"><i class="fa fa-plug"></i> Webhooks</a></li>
            {{end}}
        </ul>
        <div class="gf-sidebar-foot">
            <div class="btn-group gf-userbtns" id="navbar-dropdown">
                <a class="btn btn-default btn-sm" href="/settings"><i class="fa fa-user"></i> {{.User.Username}}</a>
                <a class="btn btn-default btn-sm" href="/logout" title="Log out"><i class="fa fa-sign-out"></i></a>
            </div>
            <div class="gf-corner-toggles">
                <button type="button" class="gf-theme-toggle" onclick="gfToggleTheme()" title="สลับธีมสว่าง / มืด" aria-label="Toggle theme">
                    <i id="gf-theme-ico" class="fa fa-moon-o"></i>
                </button>
                <button type="button" class="gf-theme-toggle gf-lang-toggle" onclick="gfToggleLang()" title="EN / ไทย" aria-label="Toggle language">
                    <span id="gf-lang-ico">ไทย</span>
                </button>
            </div>
        </div>
        {{else}}
        <a href="/login"><button type="button" class="btn btn-primary btn-sm">Login</button></a>
        {{end}}
    </aside>
    {{template "body" .}}
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="/js/dist/vendor.min.js"></script>
    <script src="/js/dist/app/gophish.min.js"></script>
    <!-- GishFlow EN/TH UI translation (served directly, no build step) -->
    <script src="/js/src/app/gishflow-i18n.js"></script>
    {{template "scripts" .}}
</body>

</html>
{{ end }}
